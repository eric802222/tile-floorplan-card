name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed bundle
        run: git diff --exit-code -- tile-floorplan-card.js
      - name: Verify map visual regression pipeline
        uses: ./.github/actions/map-visual-regression
        with:
          map: test/fixtures/visual-regression/card.json
          www-root: test/fixtures/visual-regression/www
          scenarios: test/fixtures/visual-regression/scenarios.json
          baseline-dir: test/fixtures/visual-regression/baselines
          output-dir: test/fixtures/visual-regression/output
          diff-dir: test/fixtures/visual-regression/diffs
          report: test/fixtures/visual-regression/regression.report.json
          scale: "1"
          install-dependencies: "false"
