name: Release

on:
  push:
    tags:
      - "v*"
      
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: tile-floorplan-card.js
